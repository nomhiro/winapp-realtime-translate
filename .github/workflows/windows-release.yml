name: Windows build and release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore RealtimeTranslate.sln

      - name: Build Release
        run: dotnet build RealtimeTranslate.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RealtimeTranslate.sln --configuration Release --no-build --no-restore

  publish:
    name: Build and publish Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: v0.1.${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore RealtimeTranslate.sln

      - name: Build Release
        run: dotnet build RealtimeTranslate.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RealtimeTranslate.sln --configuration Release --no-build --no-restore

      - name: Publish self-contained win-x64 application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "RealtimeTranslate-publish-$env:GITHUB_RUN_ID"
          dotnet publish src/RealtimeTranslate/RealtimeTranslate.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }
          "PUBLISH_DIRECTORY=$publishDirectory" >> $env:GITHUB_ENV

      - name: Package and verify release ZIP
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:PUBLISH_DIRECTORY -File -Recurse)
          if (-not ($files | Where-Object Name -eq "RealtimeTranslate.exe")) {
            throw "The publish output does not contain RealtimeTranslate.exe"
          }
          if (-not ($files | Where-Object Extension -eq ".dll")) {
            throw "The publish output does not contain its required DLL files"
          }
          $forbiddenFiles = @($files | Where-Object Name -in @("settings.dat", "selftest_result.txt"))
          if ($forbiddenFiles.Count -gt 0) {
            throw "The publish output contains local settings or diagnostic data"
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "RealtimeTranslate-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIRECTORY "*") -DestinationPath $zipPath
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries -notcontains "RealtimeTranslate.exe") {
              throw "The ZIP does not contain RealtimeTranslate.exe at its root"
            }
            if ($entries | Where-Object { $_ -match '(^|/)(settings\.dat|selftest_result\.txt)$' }) {
              throw "The ZIP contains local settings or diagnostic data"
            }
          } finally {
            $archive.Dispose()
          }
          "RELEASE_ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Create or update the matching GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestMain = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify the current main commit"
          }
          if ($latestMain -ne $env:GITHUB_SHA) {
            Write-Host "Skipping stale run for $env:GITHUB_SHA; main is now $latestMain."
            exit 0
          }

          $releaseQuery = ".[] | select(.tag_name == `"$env:RELEASE_VERSION`") | .target_commitish"
          $releaseTargets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq $releaseQuery)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check for an existing GitHub Release"
          }
          $releaseTargets = @($releaseTargets | Where-Object { $_ })
          if ($releaseTargets.Count -gt 1) {
            throw "Multiple releases use the version tag $env:RELEASE_VERSION"
          }
          if ($releaseTargets.Count -eq 1 -and $releaseTargets[0] -ne $env:GITHUB_SHA) {
            throw "Release $env:RELEASE_VERSION already belongs to a different commit"
          }
          $assetQuery = ".[] | select(.tag_name == `"$env:RELEASE_VERSION`") | .assets[].name"
          $releaseAssets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq $assetQuery)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check the assets of an existing GitHub Release"
          }
          $releaseAssets = @($releaseAssets | Where-Object { $_ })
          $expectedAsset = "RealtimeTranslate-$env:RELEASE_VERSION-win-x64.zip"

          $tagLines = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_VERSION" "refs/tags/$env:RELEASE_VERSION^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check the remote version tag"
          }
          $tagTarget = $null
          foreach ($line in $tagLines) {
            $parts = $line -split '\s+'
            if ($parts.Count -ge 2 -and $parts[1] -eq "refs/tags/$env:RELEASE_VERSION^{}") {
              $tagTarget = $parts[0]
              break
            }
            if ($parts.Count -ge 2 -and $parts[1] -eq "refs/tags/$env:RELEASE_VERSION") {
              $tagTarget = $parts[0]
            }
          }
          if ($tagTarget -and $tagTarget -ne $env:GITHUB_SHA) {
            throw "Tag $env:RELEASE_VERSION already points to a different commit"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes = @'
          ## RealtimeTranslate __VERSION__

          Commit: __COMMIT__

          Download and extract `RealtimeTranslate-__VERSION__-win-x64.zip`, then run `RealtimeTranslate.exe`. The .NET runtime is included.

          English OCR language support is required for screen translation. Azure credentials are not included; configure your own credentials in the app settings before using cloud translation. This build is unsigned, so Windows may show a security warning.
          '@
          $notes = $notes.Replace("__VERSION__", $env:RELEASE_VERSION).Replace("__COMMIT__", $env:GITHUB_SHA)
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8

          if ($releaseTargets.Count -eq 1) {
            if ($releaseAssets -contains $expectedAsset) {
              Write-Host "Release $env:RELEASE_VERSION already contains its ZIP; leaving the existing asset unchanged."
            } else {
              gh release upload $env:RELEASE_VERSION $env:RELEASE_ZIP_PATH
              if ($LASTEXITCODE -ne 0) {
                throw "Could not upload the ZIP to the existing matching Release"
              }
            }
          } else {
            gh release create $env:RELEASE_VERSION $env:RELEASE_ZIP_PATH `
              --title "RealtimeTranslate $env:RELEASE_VERSION" `
              --notes-file $notesPath `
              --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create the GitHub Release"
            }
          }
